<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coding Basics Cheat Sheet</title>
    <style>
      :root {
        --bg: #fbf9f4;
        --ink: #20262e;
        --muted: #66707d;
        --line: #ddd8cc;
        --code-bg: #1f2a37;
        --code-ink: #e8eef5;
        --accent: #0f7b6c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.6 Georgia,
          serif;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 24px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
      }
      nav button {
        font:
          600 0.9rem system-ui,
          sans-serif;
        padding: 8px 14px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        cursor: pointer;
      }
      nav button[aria-selected="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:focus-visible {
        outline: 3px solid #8fd3c8;
        outline-offset: 2px;
      }
      h2 {
        font-size: 1.25rem;
        margin: 28px 0 6px;
      }
      pre {
        margin: 8px 0 0;
        padding: 14px 16px;
        background: var(--code-bg);
        color: var(--code-ink);
        border-radius: 8px;
        overflow-x: auto;
        font:
          14px/1.5 ui-monospace,
          Consolas,
          monospace;
      }
      .run {
        margin-top: 8px;
        font:
          600 0.85rem system-ui,
          sans-serif;
        padding: 6px 12px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        border-radius: 6px;
        cursor: pointer;
      }
      .result {
        margin-top: 8px;
        padding: 8px 12px;
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 6px;
        font:
          14px ui-monospace,
          Consolas,
          monospace;
        min-height: 2.2em;
        white-space: pre-wrap;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Coding basics cheat sheet</h1>
      <p class="sub">
        Pick a topic, read the example, and press Run to see what it does.
      </p>

      <nav role="tablist" id="tabs"></nav>
      <div id="content"></div>
    </div>

    <script>
      const topics = {
        Variables: [
          [
            "Store a value",
            `let name = "Sam";\nconst year = 2026;\nreturn name + " in " + year;`,
          ],
          [
            "Change a value",
            `let score = 10;\nscore = score + 5;\nreturn score;`,
          ],
        ],
        Conditions: [
          [
            "if / else",
            `const age = 20;\nif (age >= 18) {\n  return "Adult";\n} else {\n  return "Minor";\n}`,
          ],
          ["Compare two values", `return 5 > 3 && 2 === 2;`],
        ],
        Loops: [
          [
            "for loop",
            `let out = [];\nfor (let i = 1; i <= 5; i++) {\n  out.push(i * 2);\n}\nreturn out.join(", ");`,
          ],
          [
            "Loop over a list",
            `const fruits = ["apple", "pear", "plum"];\nlet text = "";\nfor (const f of fruits) {\n  text += f.toUpperCase() + " ";\n}\nreturn text;`,
          ],
        ],
        Functions: [
          [
            "Define and call",
            `function greet(who) {\n  return "Hello, " + who + "!";\n}\nreturn greet("world");`,
          ],
          ["Arrow function", `const square = (n) => n * n;\nreturn square(9);`],
        ],
        "Arrays & objects": [
          [
            "Array methods",
            `const nums = [3, 1, 4, 1, 5];\nreturn nums.filter(n => n > 2).map(n => n * 10).join(", ");`,
          ],
          [
            "Object",
            `const user = { name: "Ana", langs: ["JS", "C++"] };\nreturn user.name + " knows " + user.langs.length + " languages";`,
          ],
        ],
      };

      const tabs = document.getElementById("tabs");
      const content = document.getElementById("content");

      function show(topic) {
        [...tabs.children].forEach((b) =>
          b.setAttribute("aria-selected", b.textContent === topic),
        );
        content.innerHTML = "";
        topics[topic].forEach(([title, code]) => {
          const h = document.createElement("h2");
          h.textContent = title;
          const pre = document.createElement("pre");
          pre.textContent = code;
          const btn = document.createElement("button");
          btn.className = "run";
          btn.textContent = "Run";
          const res = document.createElement("div");
          res.className = "result";
          res.setAttribute("aria-live", "polite");
          btn.addEventListener("click", () => {
            try {
              res.textContent = String(new Function(code)());
            } catch (e) {
              res.textContent = "Error: " + e.message;
            }
          });
          content.append(h, pre, btn, res);
        });
      }

      Object.keys(topics).forEach((t) => {
        const b = document.createElement("button");
        b.textContent = t;
        b.setAttribute("role", "tab");
        b.addEventListener("click", () => show(t));
        tabs.append(b);
      });
      show("Variables");
    </script>
  </body>
</html>
